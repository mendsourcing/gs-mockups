<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GovScraper Mockups</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=DM+Sans:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8FAFC; --surface:#FFFFFF; --border:#E2E8F0;
  --text:#0F172A; --text-dim:#334155; --text-muted:#64748B; --text-faint:#94A3B8;
  --accent:#1B6CA8; --accent-bg:#EFF6FF; --accent-border:#BFDBFE;
}
*{box-sizing:border-box}
body{margin:0;padding:60px 24px;font-family:'Manrope',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}
.wrap{max-width:720px;margin:0 auto}
h1{margin:0 0 6px;font-family:'DM Sans',sans-serif;font-size:28px;font-weight:800;letter-spacing:-.4px}
.sub{margin:0 0 32px;color:var(--text-muted);font-size:14px;line-height:1.5}
.mock{display:flex;align-items:center;gap:14px;padding:16px 20px;background:var(--surface);border:1px solid var(--border);border-radius:12px;text-decoration:none;color:inherit;margin-bottom:10px;transition:border-color .15s,transform .1s}
.mock:hover{border-color:var(--accent);transform:translateY(-1px)}
.mock .ico{width:36px;height:36px;background:var(--accent-bg);border:1px solid var(--accent-border);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0}
.mock .ico svg{width:18px;height:18px}
.mock .info{flex:1;min-width:0}
.mock .name{font-family:'DM Sans',sans-serif;font-size:15px;font-weight:800;color:var(--text)}
.mock .desc{font-size:12.5px;color:var(--text-muted);margin-top:3px}
.mock .arrow{color:var(--text-faint);font-size:18px}
.footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--border);font-size:12px;color:var(--text-faint);line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <h1>GovScraper Mockups</h1>
  <p class="sub">Design mockups for review and coder hand-off. Static HTML — click to view.</p>

  <a class="mock" href="notifications.html">
    <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></div>
    <div class="info">
      <div class="name">Email Preferences</div>
      <div class="desc">/notifications — toggle per-notification email preferences, MAXX-only visibility, always-on transactional list</div>
    </div>
    <div class="arrow">→</div>
  </a>
</div>
</body>
</html>
